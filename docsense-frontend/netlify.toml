# ─── Netlify — DocSense Frontend ──────────────────────────────────────────────

[[plugins]]
  # Plugin oficial Next.js para Netlify (SSR + rewrites funcionam corretamente)
  package = "@netlify/plugin-nextjs"

[build]
  command   = "npm run build"
  publish   = ".next"

# ─── Variáveis de ambiente de build ──────────────────────────────────────────
# Configure API_URL no painel do Netlify em:
# Site settings → Environment variables → Add variable
#
# API_URL = "https://seu-backend.onrender.com"   ← exemplo
#
# NÃO coloque chaves secretas aqui — use o painel do Netlify.
