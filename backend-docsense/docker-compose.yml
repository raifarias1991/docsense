services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: docsense
      POSTGRES_PASSWORD: docsense
      POSTGRES_DB: docsense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsense -d docsense"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Dentro da rede do docker-compose os serviços são acessados pelo
      # nome do serviço, não por "localhost" — por isso sobrescrevemos
      # essas três variáveis aqui (o resto continua vindo do .env).
      DATABASE_URL: postgresql+asyncpg://docsense:docsense@postgres:5432/docsense
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started

volumes:
  pgdata:
  qdrantdata:
